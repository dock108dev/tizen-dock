[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tizen-dock"
version = "0.1.0"
description = "Experimental reversible Samsung Tizen OS menu customizations"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
tizen-dock = "tizen_dock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["tizen_dock"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_guards.py" = ["E402"] # Source-tree import, also runnable with unittest.
