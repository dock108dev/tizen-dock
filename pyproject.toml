[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tizen-dock"
version = "0.1.0"
description = "Experimental reversible Samsung Tizen OS menu customizations"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.scripts]
tizen-dock = "tizen_dock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
