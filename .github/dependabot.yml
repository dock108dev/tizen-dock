version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    directories:
      - /patchers/*
      - /tests/patcher-fixture
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
