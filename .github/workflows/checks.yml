name: Source checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      compatibility:
        description: 'Also check Python 3.13 and 3.14 on Linux'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.compatibility == true) && '[{"os":"ubuntu-24.04","python":"3.12"},{"os":"macos-14","python":"3.12"},{"os":"ubuntu-24.04","python":"3.13"},{"os":"ubuntu-24.04","python":"3.14"}]' || '[{"os":"ubuntu-24.04","python":"3.12"},{"os":"macos-14","python":"3.12"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked CI tools and source package
        run: |
          python -m pip install --require-hashes -r ci/requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Python gates and reports
        run: python ci/run.py python
      - name: Retain Python reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/python/
          if-no-files-found: error
          retention-days: 14
  patchers:
    name: .NET patchers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build every patcher and exercise synthetic inputs
        run: python ci/run.py patchers
      - name: Retain patcher reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patchers-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/patchers/
          if-no-files-found: error
          retention-days: 14
  security:
    name: Workflow and security
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked scanners
        run: |
          python -m pip install --require-hashes -r ci/requirements.txt
          python ci/install_tools.py "$RUNNER_TEMP/ci-tools" actionlint shellcheck gitleaks osv-scanner
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Validate Actions, secrets, dependencies and Python security
        run: python ci/run.py security
      - name: Retain sanitized security reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/security/
          if-no-files-found: error
          retention-days: 14
  offline:
    name: offline
    needs: [python, patchers, security]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p .ci-results
          python ci/reports.py
  health:
    name: CI health (advisory)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Sample completed runs (30 days, at most 30)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/health.py
      - name: Retain health sample
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/health/
          if-no-files-found: error
          retention-days: 30
